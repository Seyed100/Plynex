[package]
name = "plynex"
version = "0.2.0"
description = "A quiet, native Windows and Linux media player"
authors = ["Plynex"]
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
opt-level = "s"
panic = "abort"
