name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plynex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libx11-dev mpv ffmpeg rpm patchelf
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm run test:preferences
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Windows test engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-mpv.ps1
          choco install ffmpeg --no-progress -y
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
      - run: npm run test:engine
      - run: node scripts/collect-licenses.mjs
      - run: npm run package -- -- --locked
        env:
          NO_STRIP: "true"
      - name: Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: plynex-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            output/*-portable.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir release
          find artifacts -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release/ \;
          find artifacts -type f -name '*setup.exe' -exec cp {} "release/Plynex-${GITHUB_REF_NAME#v}-windows-x64-setup.exe" \;
          cd release
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*
